apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam
spec:
     replicas: 3
     selector:
             matchLabels:
                        app: exam
     template:
             metadata:
                    labels:
                          app: exam
             spec:
                containers:
                          - name: exam-container
                            image: exam:latest
                            ports:
                                - containerPort: 3000
